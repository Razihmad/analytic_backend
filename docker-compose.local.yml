version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.dev
      PYTHONUNBUFFERED: 1
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - django_network
      - shared_network

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ".env"
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: project.settings.dev
    command: [ "celery", "-A", "project.celery", "worker", "--concurrency=1", "-l", "info", "-n", "worker1" ]
    networks:
      - django_network
      - shared_network

networks:
  django_network:
    driver: bridge
  shared_network:
    external: true
